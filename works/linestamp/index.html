<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINEスタンプ制作</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "M PLUS Rounded 1c", "Yu Gothic", "Hiragino Maru Gothic ProN", sans-serif;
      color: #263238;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.45) 0 8px, transparent 9px),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,0.35) 0 10px, transparent 11px),
        linear-gradient(135deg, #06c755 0%, #00b84a 100%);
      min-height: 100vh;
      line-height: 1.8;
    }

    .page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 48px 20px 64px;
    }

    .hero {
      text-align: center;
      color: #fff;
      margin-bottom: 32px;
    }

    .label {
      display: inline-block;
      background: #fff;
      color: #06c755;
      font-weight: 700;
      padding: 6px 18px;
      border-radius: 999px;
      margin-bottom: 16px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.08);
    }

    h1 {
      font-size: clamp(32px, 6vw, 56px);
      letter-spacing: 0.06em;
      line-height: 1.2;
      text-shadow: 0 4px 0 rgba(0,0,0,0.12);
    }

    .lead {
      margin-top: 16px;
      font-size: 18px;
      font-weight: 700;
    }

    .content {
      display: grid;
      gap: 28px;
    }

    .card {
      background: rgba(255,255,255,0.95);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.16);
    }

    .purchase {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 28px;
      align-items: center;
    }

    .qr-box {
      background: #fff;
      padding: 16px;
      border-radius: 24px;
      border: 4px solid #06c755;
      text-align: center;
    }

    .qr-box img {
      width: 100%;
      max-width: 180px;
      display: block;
      margin: 0 auto;
    }

    .speech {
      position: relative;
      background: #e8ffd9;
      border-radius: 28px;
      padding: 24px 28px;
      border: 3px solid #06c755;
    }

    .speech::before {
      content: "";
      position: absolute;
      left: -16px;
      top: 48%;
      width: 28px;
      height: 28px;
      background: #e8ffd9;
      border-left: 3px solid #06c755;
      border-bottom: 3px solid #06c755;
      transform: rotate(45deg);
    }

    .speech h2 {
      font-size: 28px;
      color: #06c755;
      margin-bottom: 8px;
    }

    .speech p {
      font-size: 20px;
      font-weight: 700;
    }

    .stamp-preview h2,
    .info h2 {
      font-size: 24px;
      margin-bottom: 18px;
      color: #06c755;
      text-align: center;
    }

    .stamp-image {
      background: #f7f7f7;
      border-radius: 24px;
      padding: 18px;
      text-align: center;
    }

    .stamp-image img {
      width: 100%;
      max-width: 760px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      vertical-align: bottom;
    }

    .meta-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      list-style: none;
    }

    .meta-list li {
      background: #f2fff5;
      border: 2px solid #c8f7d4;
      border-radius: 18px;
      padding: 16px 18px;
      font-weight: 700;
    }

    .meta-list span {
      display: block;
      color: #06c755;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .process {
      margin-top: 22px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .process-item {
      background: #06c755;
      color: #fff;
      border-radius: 18px;
      padding: 14px 10px;
      text-align: center;
      font-weight: 700;
      box-shadow: 0 5px 0 rgba(0,0,0,0.12);
    }

    .process-item small {
      display: block;
      font-size: 12px;
      opacity: 0.9;
    }

    .back {
      display: inline-block;
      margin-top: 32px;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    .back:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .page {
        padding: 32px 16px 48px;
      }

      .purchase {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .speech::before {
        left: 50%;
        top: -16px;
        transform: translateX(-50%) rotate(135deg);
      }

      .meta-list,
      .process {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 22px;
        border-radius: 22px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="hero">
      <p class="label">Illustrator Work</p>
      <h1>LINEスタンプ制作</h1>
      <p class="lead">Illustratorで制作したオリジナルLINEスタンプです。</p>
    </section>

    <div class="content">
      <section class="card purchase">
        <div class="qr-box">
          <img src="img/qr.png" alt="LINEスタンプ購入用QRコード">
        </div>

        <div class="speech">
          <h2>ぜひ買ってください！笑</h2>
          <p>
            QRコードからスタンプページにアクセスできます。<br>
            日常でゆるく使える、ポップな雰囲気のスタンプを制作しました。
          </p>
        </div>
      </section>

      <section class="card stamp-preview">
        <h2>Stamp Preview</h2>
        <div class="stamp-image">
          <img src="img/linestamp.jpg" alt="制作したLINEスタンプのスクリーンショット">
        </div>
      </section>

      <section class="card info">
        <h2>制作情報</h2>

        <ul class="meta-list">
          <li>
            <span>利用ツール</span>
            Illustrator
          </li>
          <li>
            <span>制作時間</span>
            30min
          </li>
        </ul>

        <div class="process">
          <div class="process-item">
            検討
            <small>5min</small>
          </div>
          <div class="process-item">
            制作
            <small>10min</small>
          </div>
          <div class="process-item">
            書き出し
            <small>5min</small>
          </div>
          <div class="process-item">
            申請
            <small>10min</small>
          </div>
        </div>
      </section>
    </div>

    <a class="back" href="../../index.html">← Worksへ戻る</a>
  </main>
</body>
</html>
